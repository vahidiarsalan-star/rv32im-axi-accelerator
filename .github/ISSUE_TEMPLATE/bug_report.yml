name: Reproducible bug
description: Report an RTL, firmware, simulation or FPGA implementation issue
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the failing instruction, command stream or board symptom.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and environment
      description: Commit, source digest, tool versions, command, seed and relevant log. Include board/part if applicable.
    validations:
      required: true
